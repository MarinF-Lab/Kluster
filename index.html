<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kluster</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/gems.css">
<link rel="stylesheet" href="css/animations.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header>

<div class="logo">

💎 Kluster

</div>

<div class="search">

<input placeholder="Buscar...">

</div>

<div class="profile">

Administrador

</div>

</header>

<main>

<section class="left">

<div class="card saludo">

<h1>Hola Alejandro 👋</h1>

<p>Centro de control de tu empresa.</p>

</div>

<div class="card">

<h3>Actividad reciente</h3>

</div>

<div class="card">

<h3>Tareas</h3>

</div>

</section>

<section class="center">

<div id="cluster">

<div class="gem g-center">
<div class="icon">💎</div>
<span>Kluster</span>
</div>

<div class="gem g1">
<div class="icon">💰</div>
<span>Ingresos</span>
</div>

<div class="gem g2">
<div class="icon">🧾</div>
<span>Facturación</span>
</div>

<div class="gem g3">
<div class="icon">📦</div>
<span>Inventario</span>
</div>

<div class="gem g4">
<div class="icon">📊</div>
<span>Reportes</span>
</div>

<div class="gem g5">
<div class="icon">💳</div>
<span>Egresos</span>
</div>

<div class="gem g6">
<div class="icon">🏦</div>
<span>Contabilidad</span>
</div>

<div class="gem g7">
<div class="icon">👥</div>
<span>Clientes</span>
</div>

</div>

</section>

<section class="right">

<div class="card">

<h2>Ingresos</h2>

</div>

<div class="card">

<h2>Gráficos</h2>

</div>

<div class="card">

<h2>Movimientos</h2>

</div>

</section>

</main>

<script src="js/app.js"></script>

<script src="js/charts.js"></script>

</body>

</html>
